# Actuator serves the spec's GET /health: root base path, health only.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health

calls:
  dataset: ${DATASET:telecom_analytics}
  # BigQuery job ids are scoped to a location; it must match the dataset's (Terraform default US).
  location: ${DATASET_LOCATION:US}
